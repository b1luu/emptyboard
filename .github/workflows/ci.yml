name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  mutation:
    # A full single-job run measured ~29 min locally on 2 cores (limit 25), so each
    # mutated file runs as its own matrix job. Per-file break = floor(measured score) - 2.
    name: Mutation testing (${{ matrix.file }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: server/services/time-window.ts
            break: 96
          - file: server/services/availability.ts
            break: 73
          - file: server/services/schedule-sync.ts
            break: 73
          - file: server/soc/parser.ts
            break: 92
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: |
          jq '.thresholds.break = ${{ matrix.break }}' stryker.config.json > stryker.ci.json
          npx stryker run stryker.ci.json --mutate "${{ matrix.file }}"

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
